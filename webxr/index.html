<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>VR Maze Game</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
      }
      body, html {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0c10;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      #canvas-container {
        width: 100%;
        height: 100%;
        display: block;
        cursor: crosshair;
      }
      #ui-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 16px;
        z-index: 10;
      }
      .hud-card {
        pointer-events: auto;
        background: rgba(15, 23, 42, 0.88);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid rgba(51, 65, 85, 0.7);
        border-radius: 8px;
        padding: 10px 14px;
        color: #f8fafc;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      }
      .badge {
        background: rgba(6, 78, 59, 0.8);
        border: 1px solid rgba(16, 185, 129, 0.7);
        color: #34d399;
        font-size: 11px;
        font-weight: bold;
        padding: 2px 8px;
        border-radius: 4px;
      }
      .btn {
        pointer-events: auto;
        background: rgba(30, 41, 59, 0.9);
        border: 1px solid rgba(71, 85, 105, 0.6);
        color: #e2e8f0;
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.15s ease;
      }
      .btn:hover {
        background: rgba(51, 65, 85, 0.9);
        color: #ffffff;
      }
      .btn.active {
        background: rgba(14, 116, 144, 0.4);
        border-color: #38bdf8;
        color: #38bdf8;
      }
      #minimap-card {
        position: absolute;
        top: 70px;
        right: 16px;
        width: 180px;
        height: 180px;
        padding: 6px;
      }
      #fade-overlay {
        position: absolute;
        inset: 0;
        background: #000;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.7s ease;
        z-index: 20;
      }
      #reticle {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.5);
        box-shadow: 0 0 4px rgba(0, 0, 0, 0.8);
        pointer-events: none;
      }
      #victory-modal {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(10px);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 30;
        pointer-events: auto;
      }
      .modal-box {
        background: #0f172a;
        border: 2px solid #10b981;
        border-radius: 14px;
        padding: 28px;
        max-width: 440px;
        width: 90%;
        text-align: center;
        color: white;
        box-shadow: 0 20px 40px rgba(0,0,0,0.8);
      }
    </style>

      let t = translations[langlang] || translations.en;
      let exitSignMesh = null;
      let currentLevel = 1;
      let mazeData = null;
      let updateExitConfirmCanvas = null;

      function applyLanguage(newLass) {
        lass = newLass;
        if (lass === 'cn') {
          langlang = 'zh';
        } else if (lass === 'kr') {
          langlang = 'ko';
        } else if (lass === 'jp' || lass === 'ja') {
          langlang = 'jp';
        } else if (['en', 'ru', 'es', 'th'].includes(lass)) {
          langlang = lass;
        } else {
          langlang = 'en';
        }

        t = translations[langlang] || translations.en;

        document.title = t.title;
        const hudTitle = document.getElementById('hud-title');
        if (hudTitle) hudTitle.innerText = t.title;
        const hudGoal = document.getElementById('hud-goal');
        if (hudGoal) hudGoal.innerText = t.goal;
        const hudTime = document.getElementById('hud-time-label');
        if (hudTime) hudTime.innerText = t.time;
        const hudVrHint = document.getElementById('hud-vr-hint');
        if (hudVrHint) hudVrHint.innerText = t.vrHint;
        const hudGuide = document.getElementById('hud-bottom-guide');
        if (hudGuide) hudGuide.innerText = t.guide;
        const vicTitle = document.getElementById('victory-title');

        if (btnRestart) btnRestart.innerText = t.restart;

        renderLangRadios();

        if (exitSignMesh && typeof createExitSignTex === 'function') {
          exitSignMesh.material.map = createExitSignTex(currentLevel);
          exitSignMesh.material.needsUpdate = true;
        }
        if (mazeData && typeof playerRig !== 'undefined' && playerRig && typeof updateMinimap === 'function') {
          updateMinimap(playerRig.position.x, playerRig.position.z, playerRig.rotation.y);
        }
      }

      function renderLangRadios() {
        const bar = document.getElementById('lang-radio-bar');
        if (!bar) return;
        bar.innerHTML = '';
        languageOptions.forEach((opt) => {
          const isSelected = (opt.lass === lass);
          const label = document.createElement('label');
          label.style.cssText = `display: flex; align-items: center; gap: 4px; padding: 2px 7px; border-radius: 4px; cursor: pointer; white-space: nowrap; ${isSelected ? 'background: rgba(14, 116, 144, 0.4); border: 1px solid #38bdf8; color: #38bdf8; font-weight: bold;' : 'color: #94a3b8; border: 1px solid transparent;'}`;

          const radio = document.createElement('input');
          radio.type = 'radio';
          radio.name = 'standalone-lang';
          radio.value = opt.lass;
          radio.checked = isSelected;
          radio.style.accentColor = '#38bdf8';
          radio.style.cursor = 'pointer';
          radio.addEventListener('change', () => {
            const url = new URL(window.location.href);
            url.searchParams.set('l', opt.lass);
            window.history.replaceState(null, '', url.toString());
            applyLanguage(opt.lass);
          });

          label.appendChild(radio);
          label.appendChild(document.createTextNode(opt.label));
          bar.appendChild(label);
        });
      }

      // --- Maze Dimensions and Grid Constants ---
      const TILE_SIZE = 2.4;
      const WALL_HEIGHT = 2.6;

      // --- Web Audio Sound Engine ---
      class SimpleAudio {
        constructor() {
          this.ctx = null;
          this.isMuted = false;
          this.lastStep = 0;
        }
        init() {
          if (!this.ctx && window.AudioContext) {
            this.ctx = new AudioContext();
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
          }
        }
        step() {
          if (this.isMuted) return;
          this.init();
          if (!this.ctx) return;
          const now = performance.now();
          if (now - this.lastStep < 340) return;
          this.lastStep = now;

          const time = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(140, time);
          osc.frequency.exponentialRampToValueAtTime(40, time + 0.05);
          gain.gain.setValueAtTime(0.06, time);
          gain.gain.exponentialRampToValueAtTime(0.001, time + 0.05);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(time);
          osc.stop(time + 0.06);
        }
        chime() {
          if (this.isMuted) return;
          this.init();
          if (!this.ctx) return;
          const freqs = [523.25, 783.99, 1046.5];
          freqs.forEach((f, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            const time = this.ctx.currentTime + i * 0.12;
            osc.frequency.setValueAtTime(f, time);
            gain.gain.setValueAtTime(0.1, time);
            gain.gain.exponentialRampToValueAtTime(0.001, time + 0.8);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(time);
            osc.stop(time + 0.9);
          });
        }
      }
      const audio = new SimpleAudio();

      // --- True Labyrinth Generation via Randomized Prim's Algorithm ---
      // Creates an authentic labyrinth with abundant junctions, dead ends, and branches
      function generateMaze(rows, cols) {
        rows = Math.floor(rows / 2) * 2 + 1;
        cols = Math.floor(cols / 2) * 2 + 1;
        if (rows < 11) rows = 11;
        if (cols < 11) cols = 11;

        const grid = Array.from({ length: rows }, () => Array(cols).fill(1));
        const startR = rows - 2;
        const startC = 1;
        grid[startR][startC] = 0;

        const frontier = [];
        const addFrontiers = (cellR, cellC) => {
          const dirs = [[-2, 0], [2, 0], [0, -2], [0, 2]];
          for (const [dr, dc] of dirs) {
            const nr = cellR + dr;
            const nc = cellC + dc;
            if (nr > 0 && nr < rows - 1 && nc > 0 && nc < cols - 1 && grid[nr][nc] === 1) {
              frontier.push([cellR + dr / 2, cellC + dc / 2, nr, nc]);
            }
          }
        };

        addFrontiers(startR, startC);

        while (frontier.length > 0) {
          const randIdx = Math.floor(Math.random() * frontier.length);
          const [wR, wC, tR, tC] = frontier.splice(randIdx, 1)[0];
          if (grid[tR][tC] === 1) {
            grid[wR][wC] = 0;
            grid[tR][tC] = 0;
            addFrontiers(tR, tC);
          }
        }

        // Additional branches and loops
        const extraBranches = Math.floor((rows * cols) * 0.035);
        for (let i = 0; i < extraBranches; i++) {
          const rR = 1 + Math.floor(Math.random() * (rows - 2));
          const rC = 1 + Math.floor(Math.random() * (cols - 2));
          if (grid[rR][rC] === 1) {
            const neighbors = [
              [rR - 1, rC], [rR + 1, rC], [rR, rC - 1], [rR, rC + 1]
            ].filter(([nr, nc]) => nr >= 0 && nr < rows && nc >= 0 && nc < cols && grid[nr][nc] === 0);
            if (neighbors.length === 2) grid[rR][rC] = 0;
          }
        }

        // Goal location near opposite corner (top right)
        let exitC = cols - 2;
        let exitR = 1;
        if (grid[exitR][exitC] !== 0) {
          let found = false;
          for (let r = 1; r <= 3; r++) {
            for (let c = cols - 2; c >= 1; c--) {
              if (grid[r][c] === 0) {
                exitR = r; exitC = c; found = true; break;
              }
            }
            if (found) break;
          }
        }

        grid[exitR][exitC] = 3;
        grid[startR][startC] = 2;

        return {
          rows,
          cols,
          grid,
          startX: startC,
          startZ: startR,
          exitX: exitC,
          exitZ: exitR,
        };
      }

      // Procedural textures
      function createWallTex() {
        const c = document.createElement('canvas');
        c.width = c.height = 512;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#64748b';
        ctx.fillRect(0, 0, 512, 512);

        for (let i = 0; i < 4000; i++) {
          ctx.fillStyle = Math.random() > 0.5 ? '#94a3b8' : '#475569';
          ctx.fillRect(Math.random() * 512, Math.random() * 512, 2, 2);
        }

        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 3;
        for (let y = 0; y <= 512; y += 128) {
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(512, y); ctx.stroke();
        }
        for (let row = 0; row < 4; row++) {
          const y = row * 128;
          const off = (row % 2) * 128;
          for (let x = off; x <= 512; x += 256) {
            ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 128); ctx.stroke();
          }
        }
        const tex = new THREE.CanvasTexture(c);
        tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
        return tex;
      }

      function createFloorTex() {
        const c = document.createElement('canvas');
        c.width = c.height = 512;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(0, 0, 512, 512);
        const s = 128;
        for (let x = 0; x < 512; x += s) {
          for (let y = 0; y < 512; y += s) {
            ctx.fillStyle = `rgb(${40 + Math.random()*8}, ${44 + Math.random()*8}, ${54 + Math.random()*8})`;
            ctx.fillRect(x + 2, y + 2, s - 4, s - 4);
          }
        }
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 4;
        for (let i = 0; i <= 512; i += s) {
          ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(512, i); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 512); ctx.stroke();
        }
        const tex = new THREE.CanvasTexture(c);
        tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
        return tex;
      }

        ctx.fillText(`${t.stage} ${level} / 8`, 256, 165);
        return new THREE.CanvasTexture(c);
      }

      // --- Maze Management ---
      currentLevel = 1;

      function buildMaze(level) {
        while (mazeGroup.children.length > 0) {
          mazeGroup.remove(mazeGroup.children[0]);
        }
        // Scaled maze dimensions with rich dead ends
        const size = Math.min(23, 15 + (level - 1) * 2);
        mazeData = generateMaze(size, size);

        const wallTex = createWallTex();
        const floorTex = createFloorTex();
        floorTex.repeat.set(mazeData.cols, mazeData.rows);

        const wallMat = new THREE.MeshStandardMaterial({ map: wallTex, roughness: 0.85 });
        const floorMat = new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.7, side: THREE.DoubleSide });
        const ceilMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, side: THREE.DoubleSide });

        const pW = mazeData.cols * TILE_SIZE;
        const pD = mazeData.rows * TILE_SIZE;

        const floor = new THREE.Mesh(new THREE.PlaneGeometry(pW, pD), floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.set(pW / 2 - TILE_SIZE / 2, 0, pD / 2 - TILE_SIZE / 2);
        floor.frustumCulled = false;
        mazeGroup.add(floor);

        const ceil = new THREE.Mesh(new THREE.PlaneGeometry(pW, pD), ceilMat);
        ceil.rotation.x = Math.PI / 2;
        ceil.position.set(pW / 2 - TILE_SIZE / 2, WALL_HEIGHT, pD / 2 - TILE_SIZE / 2);
        ceil.frustumCulled = false;
        mazeGroup.add(ceil);

        let wallCount = 0;
        for (let r = 0; r < mazeData.rows; r++) {
          for (let c = 0; c < mazeData.cols; c++) {
            if (mazeData.grid[r][c] === 1) wallCount++;
          }
        }

        const wallMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(TILE_SIZE, WALL_HEIGHT, TILE_SIZE), wallMat, wallCount);
        wallMesh.frustumCulled = false;
        mazeGroup.add(wallMesh);
        const matrix = new THREE.Matrix4();
        let idx = 0;

        for (let r = 0; r < mazeData.rows; r++) {
          for (let c = 0; c < mazeData.cols; c++) {
            const x = c * TILE_SIZE;
            const z = r * TILE_SIZE;
            if (mazeData.grid[r][c] === 1) {
              matrix.setPosition(x, WALL_HEIGHT / 2, z);
              wallMesh.setMatrixAt(idx++, matrix);
            } else if ((r + c) % 3 === 0) {
              const fixture = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.04, 0.2), new THREE.MeshBasicMaterial({ color: 0xffffff }));
              fixture.position.set(x, WALL_HEIGHT - 0.02, z);
              mazeGroup.add(fixture);
            }
          }
        }
        wallMesh.instanceMatrix.needsUpdate = true;

        // Goal signboard
        const ex = mazeData.exitX * TILE_SIZE;
        const ez = mazeData.exitZ * TILE_SIZE;
        const exitSign = new THREE.Mesh(new THREE.PlaneGeometry(1.0, 0.5), new THREE.MeshBasicMaterial({ map: createExitSignTex(level) }));
        exitSign.position.set(ex, WALL_HEIGHT - 0.35, ez + 0.11);
        mazeGroup.add(exitSign);
        exitSignMesh = exitSign;
        const exitLight = new THREE.PointLight(0x10b981, 3.5, 9.0);
        exitLight.position.set(ex, WALL_HEIGHT - 0.6, ez + 0.4);
        mazeGroup.add(exitLight);

        // Player initial position
        playerRig.position.set(mazeData.startX * TILE_SIZE, 0, mazeData.startZ * TILE_SIZE);
        playerRig.rotation.y = 0;
        facingDir = 0;

        document.getElementById('level-badge').innerText = `${t.stage} ${level} / 8`;
      }

      function updateMinimap(pX, pZ, pDir) {
        if (!mazeData) return;
        const size = 256;
        mapCtx.fillStyle = '#0a0f1d';
        mapCtx.fillRect(0, 0, size, size);

        // Grid lines
        mapCtx.strokeStyle = '#1e293b';
        mapCtx.lineWidth = 1;
        for (let i = 0; i <= size; i += 32) {
          mapCtx.beginPath(); mapCtx.moveTo(0, i); mapCtx.lineTo(size, i); mapCtx.stroke();
          mapCtx.beginPath(); mapCtx.moveTo(i, 0); mapCtx.lineTo(i, size); mapCtx.stroke();
        }

        const padding = 20;
        const innerSize = size - padding * 2;
        const maxDim = Math.max(mazeData.cols, mazeData.rows);
        const cellSize = (innerSize * 0.75) / maxDim;

        const centerX = size / 2;
        const centerY = size / 2;
        const dir = pDir !== undefined ? pDir : playerRig.rotation.y;

        const pCol = pX / TILE_SIZE;
        const pRow = pZ / TILE_SIZE;
        const px = pCol * cellSize;
        const py = pRow * cellSize;

        // Heading-up rotation
        mapCtx.save();
        mapCtx.translate(centerX, centerY);
        mapCtx.rotate(dir);
        mapCtx.translate(-px, -py);

        const halfCell = cellSize / 2;
        for (let r = 0; r < mazeData.rows; r++) {
          for (let c = 0; c < mazeData.cols; c++) {
            const val = mazeData.grid[r][c];
            if (val === 1) mapCtx.fillStyle = '#475569';
            else if (val === 2) mapCtx.fillStyle = '#3b82f6';
            else if (val === 3) mapCtx.fillStyle = '#10b981';
            else mapCtx.fillStyle = '#1e293b';
            mapCtx.fillRect(c * cellSize - halfCell, r * cellSize - halfCell, cellSize, cellSize);
          }
        }

        // Goal marker
        const ex = mazeData.exitX * cellSize;
        const ey = mazeData.exitZ * cellSize;
        mapCtx.fillStyle = '#10b981';
        mapCtx.beginPath();
        mapCtx.arc(ex, ey, halfCell * 0.8, 0, Math.PI * 2);
        mapCtx.fill();
        mapCtx.fillStyle = '#ffffff';
        mapCtx.font = 'bold 8px sans-serif';
        mapCtx.textAlign = 'center';
        mapCtx.textBaseline = 'middle';
        mapCtx.fillText(t.goal, ex, ey);

        mapCtx.restore();

        // Player Arrow Cursor
        mapCtx.save();
        mapCtx.translate(centerX, centerY);

        const arrowLen = cellSize * 0.48;
        const arrowWid = cellSize * 0.34;
        const halfL = arrowLen / 2;
        const halfW = arrowWid / 2;

        mapCtx.fillStyle = '#ef4444';
        mapCtx.strokeStyle = '#ffffff';
        mapCtx.lineWidth = 1.4;

        mapCtx.beginPath();
        mapCtx.moveTo(0, -halfL);
        mapCtx.lineTo(halfW, halfL);
        mapCtx.lineTo(0, halfL * 0.35);
        mapCtx.lineTo(-halfW, halfL);
        mapCtx.closePath();
        mapCtx.fill();
        mapCtx.stroke();

        mapCtx.restore();

        // North compass
        mapCtx.save();
        mapCtx.translate(size - 20, 20);
        mapCtx.rotate(dir);
        mapCtx.fillStyle = 'rgba(15, 23, 42, 0.85)';
        mapCtx.beginPath(); mapCtx.arc(0, 0, 13, 0, Math.PI * 2); mapCtx.fill();
        mapCtx.strokeStyle = '#38bdf8'; mapCtx.lineWidth = 1.2; mapCtx.stroke();
        mapCtx.fillStyle = '#ef4444';
        mapCtx.beginPath(); mapCtx.moveTo(0, -10); mapCtx.lineTo(3.5, 2); mapCtx.lineTo(-3.5, 2); mapCtx.closePath(); mapCtx.fill();
        mapCtx.fillStyle = '#ffffff'; mapCtx.font = 'bold 8px monospace'; mapCtx.textAlign = 'center'; mapCtx.textBaseline = 'middle';
        mapCtx.fillText('N', 0, 6.5);
        mapCtx.restore();

        // Upright readable Elapsed Time display (unaffected by map heading rotation)
        const currentElapsedSec = Math.floor((performance.now() - startTime) / 1000);
        const curMins = String(Math.floor(currentElapsedSec / 60)).padStart(2, '0');
        const curSecs = String(currentElapsedSec % 60).padStart(2, '0');
        const timeFormatted = `${curMins}:${curSecs}`;

        mapCtx.save();
        mapCtx.fillStyle = 'rgba(15, 23, 42, 0.9)';
        mapCtx.strokeStyle = '#38bdf8';
        mapCtx.lineWidth = 1.5;
        mapCtx.beginPath();
        if (mapCtx.roundRect) {
          mapCtx.roundRect(14, size - 30, size - 28, 22, 5);
        } else {
          mapCtx.rect(14, size - 30, size - 28, 22);
        }
        mapCtx.fill();
        mapCtx.stroke();

        mapCtx.fillStyle = '#38bdf8';
        mapCtx.font = 'bold 10px sans-serif';
        mapCtx.textAlign = 'left';
        mapCtx.textBaseline = 'middle';
        mapCtx.fillText('⏱️ ' + t.time, 22, size - 19);

        mapCtx.fillStyle = '#ffffff';
        mapCtx.font = 'bold 13px monospace';
        mapCtx.textAlign = 'right';
        mapCtx.fillText(timeFormatted, size - 22, size - 19);
        mapCtx.restore();

        mapTex.needsUpdate = true;

        // Sync to 2D screen hud canvas
        const hudCanvas = document.getElementById('hud-map-canvas');
        if (hudCanvas) {
          const hCtx = hudCanvas.getContext('2d');
          hCtx.clearRect(0, 0, hudCanvas.width, hudCanvas.height);
          hCtx.drawImage(mapCanvas, 0, 0, hudCanvas.width, hudCanvas.height);
        }
      }

      // Input listeners
      const keys = {};
      window.addEventListener('keydown', (e) => {
        keys[e.code] = true;
        if (e.code === 'KeyF') {
          flashlight.visible = !flashlight.visible;
          document.getElementById('btn-flash').classList.toggle('active', flashlight.visible);
        }
        if (e.code === 'KeyM') {
          tabletGroup.visible = !tabletGroup.visible;
          document.getElementById('btn-map').classList.toggle('active', tabletGroup.visible);
          document.getElementById('minimap-card').style.display = tabletGroup.visible ? 'block' : 'none';
        }
      });
      window.addEventListener('keyup', (e) => { keys[e.code] = false; });

      let isLocked = false;
      let mouseYaw = 0;
      let mousePitch = 0;

      container.addEventListener('click', () => {
        if (!renderer.xr.isPresenting) {
          container.requestPointerLock?.();
          audio.init();
        }
      });
      document.addEventListener('pointerlockchange', () => {
        isLocked = document.pointerLockElement === container;
      });
      window.addEventListener('mousemove', (e) => {
        if (!isLocked || renderer.xr.isPresenting) return;
        mouseYaw -= e.movementX * 0.0024;
        mousePitch -= e.movementY * 0.0024;
        mousePitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, mousePitch));
        camera.rotation.x = mousePitch;
        playerRig.rotation.y = mouseYaw;
      });

      // UI button events
      document.getElementById('btn-flash').addEventListener('click', () => {
        flashlight.visible = !flashlight.visible;
        document.getElementById('btn-flash').classList.toggle('active', flashlight.visible);
      });
      document.getElementById('btn-map').addEventListener('click', () => {
        tabletGroup.visible = !tabletGroup.visible;
        document.getElementById('btn-map').classList.toggle('active', tabletGroup.visible);
        document.getElementById('minimap-card').style.display = tabletGroup.visible ? 'block' : 'none';
      });
      document.getElementById('btn-sound').addEventListener('click', () => {
        audio.isMuted = !audio.isMuted;
        document.getElementById('btn-sound').classList.toggle('active', !audio.isMuted);
      });
      document.getElementById('btn-restart').addEventListener('click', () => {
        advanceStageOrRestart();
      });

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      // Render Loop
      const clock = new THREE.Clock();
      let lastMapUpdate = 0;
      let facingDir = 0; // 0: North, 1: East, 2: South, 3: West
      let stickTurnNeutral = true;
      let keyTurnNeutral = true;
      const lastButtons = {};

      buildMaze(currentLevel);

      renderer.setAnimationLoop(() => {
        const dt = Math.min(clock.getDelta(), 0.1);

        // Timer
        const elapsedSec = Math.floor((performance.now() - startTime) / 1000);
        const mins = String(Math.floor(elapsedSec / 60)).padStart(2, '0');
        const secs = String(elapsedSec % 60).padStart(2, '0');
        document.getElementById('time-display').innerText = `${mins}:${secs}`;

        let turnCmd = 0;
        let moveInput = 0;
        if (keys['KeyW'] || keys['ArrowUp']) moveInput += 1;
        if (keys['KeyS'] || keys['ArrowDown']) moveInput -= 1;

        // VR Controllers
        let vrStickX = 0;
        if (renderer.xr.isPresenting) {
          const session = renderer.xr.getSession();
          if (session && session.inputSources) {
            session.inputSources.forEach((s, idx) => {
              if (!s.gamepad) return;
              const ax = s.gamepad.axes;
              const btns = s.gamepad.buttons;

              let stickX = 0;
              let stickY = 0;
              const mag01 = Math.hypot(ax[0] || 0, ax[1] || 0);
              const mag23 = ax.length >= 4 ? Math.hypot(ax[2] || 0, ax[3] || 0) : 0;

              if (mag01 >= mag23 && mag01 > 0.38) {
                stickX = ax[0] || 0;
                stickY = ax[1] || 0;
              } else if (mag23 > mag01 && mag23 > 0.38) {
                stickX = ax[2] || 0;
                stickY = ax[3] || 0;
              }

              if (Math.abs(stickX) > Math.abs(vrStickX)) {
                vrStickX = stickX;
              }

              if (stickY < -0.38) moveInput += 1;
              else if (stickY > 0.38) moveInput -= 1;

              if (!lastButtons[idx]) lastButtons[idx] = [];
              const isJustPressed = (b) => {
                if (!btns || b >= btns.length) return false;
                const cur = btns[b]?.pressed || false;
                const prev = lastButtons[idx][b] || false;
                lastButtons[idx][b] = cur;
                return cur && !prev;
              };

              // Use current controller/grip directly for single-controller support
              const currentCtrl = renderer.xr.getController(idx);
              const currentGrip = renderer.xr.getControllerGrip(idx);

              let hitAction = null;
              if (confirmGroup.visible) {
                const raycaster = new THREE.Raycaster();
                const tempMat = new THREE.Matrix4();
                tempMat.identity().extractRotation(currentCtrl.matrixWorld);
                raycaster.ray.origin.setFromMatrixPosition(currentCtrl.matrixWorld);
                raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMat);
                const hits = raycaster.intersectObjects(confirmGroup.children, true);
                for (const h of hits) {
                  if (h.object.userData?.action) {
                    hitAction = h.object.userData.action;
                    break;
                  }
                }
              }

              // Stage Clear Window interaction in VR
              if (goalModalGroup.visible) {
                if (isJustPressed(0) || isJustPressed(4) || isJustPressed(3) || isJustPressed(5)) {
                  advanceStageOrRestart();
                  return;
                }
              }

              // Trigger (Click / Select)
              if (isJustPressed(0)) {
                if (confirmGroup.visible) {
                  if (hitAction === 'exit') session.end();
                  else if (hitAction === 'cancel') confirmGroup.visible = false;
                }
              }

              // Button A / X: Toggle map on active controller grip
              if (isJustPressed(4) || isJustPressed(3)) {
                if (confirmGroup.visible) {
                  confirmGroup.visible = false;
                } else {
                  toggleMapOnHand(currentGrip);
                }
              }

              // Button B / Y: Toggle exit confirmation dialog
              if (isJustPressed(5)) {
                if (confirmGroup.visible) {
                  session.end();
                } else {
                  toggleExitConfirm();
                }
              }
            });
          }
        }

        // Stick Turn: requires neutral return before turning again
        if (Math.abs(vrStickX) < 0.25) {
          stickTurnNeutral = true;
        } else if (stickTurnNeutral) {
          if (vrStickX > 0.5) {
            turnCmd = 1;
            stickTurnNeutral = false;
          } else if (vrStickX < -0.5) {
            turnCmd = -1;
            stickTurnNeutral = false;
          }
        }

        // Keyboard A/D or Arrow keys: one turn per keystroke
        const isKeyLeft = keys['KeyA'] || keys['ArrowLeft'];
        const isKeyRight = keys['KeyD'] || keys['ArrowRight'];
        if (!isKeyLeft && !isKeyRight) {
          keyTurnNeutral = true;
        } else if (keyTurnNeutral) {
          if (isKeyRight) {
            turnCmd = 1;
            keyTurnNeutral = false;
          } else if (isKeyLeft) {
            turnCmd = -1;
            keyTurnNeutral = false;
          }
        }

        // Execute 90° turn and snap to cell center
        if (turnCmd !== 0) {
          if (turnCmd === 1) facingDir = (facingDir + 1) % 4;
          else facingDir = (facingDir + 3) % 4;
          audio.step();

          const curCol = Math.round(playerRig.position.x / TILE_SIZE);
          const curRow = Math.round(playerRig.position.z / TILE_SIZE);
          playerRig.position.x = curCol * TILE_SIZE;
          playerRig.position.z = curRow * TILE_SIZE;

          mouseYaw = -facingDir * (Math.PI / 2);
          playerRig.rotation.y = mouseYaw;
        } else if (renderer.xr.isPresenting) {
          playerRig.rotation.y = -facingDir * (Math.PI / 2);
        } else if (isLocked) {
          // In desktop mode, sync facingDir to nearest cardinal direction of the player's view
          const normYaw = ((-mouseYaw % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
          facingDir = Math.round(normYaw / (Math.PI / 2)) % 4;
        }

        // Pure Grid Discrete-Rail Locomotion
        if (moveInput !== 0) {
          const spd = (keys['ShiftLeft'] ? 3.2 : 2.2) * dt;
          const moveDist = (moveInput > 0 ? 1 : -1) * spd;

          const curCol = Math.round(playerRig.position.x / TILE_SIZE);
          const curRow = Math.round(playerRig.position.z / TILE_SIZE);
          const curCenterX = curCol * TILE_SIZE;
          const curCenterZ = curRow * TILE_SIZE;

          const isWall = (c, r) => {
            if (r < 0 || r >= mazeData.rows || c < 0 || c >= mazeData.cols) return true;
            return mazeData.grid[r][c] === 1;
          };

          if (facingDir === 0 || facingDir === 2) {
            // North-South rail
            playerRig.position.x = curCenterX;

            const dirSign = facingDir === 0 ? -1 : 1;
            const deltaZ = dirSign * moveDist;
            let targetZ = playerRig.position.z + deltaZ;

            if (deltaZ < 0) {
              if (isWall(curCol, curRow - 1) && targetZ < curCenterZ) {
                targetZ = curCenterZ;
              }
            } else if (deltaZ > 0) {
              if (isWall(curCol, curRow + 1) && targetZ > curCenterZ) {
                targetZ = curCenterZ;
              }
            }

            if (playerRig.position.z !== targetZ) {
              playerRig.position.z = targetZ;
              audio.step();
            }
          } else {
            // East-West rail
            playerRig.position.z = curCenterZ;

            const dirSign = facingDir === 1 ? 1 : -1;
            const deltaX = dirSign * moveDist;
            let targetX = playerRig.position.x + deltaX;

            if (deltaX > 0) {
              if (isWall(curCol + 1, curRow) && targetX > curCenterX) {
                targetX = curCenterX;
              }
            } else if (deltaX < 0) {
              if (isWall(curCol - 1, curRow) && targetX < curCenterX) {
                targetX = curCenterX;
              }
            }

            if (playerRig.position.x !== targetX) {
              playerRig.position.x = targetX;
              audio.step();
            }
          }
        }

        // Goal reached check: always display the elapsed time window on goal
        if (!isFading && mazeData) {
          const cCol = Math.round(playerRig.position.x / TILE_SIZE);
          const cRow = Math.round(playerRig.position.z / TILE_SIZE);
          if (cCol === mazeData.exitX && cRow === mazeData.exitZ) {
            isFading = true;
            audio.chime();
            showStageClearWindow(currentLevel, `${mins}:${secs}`);
          }
        }

        // Minimap refresh throttle
        const now = performance.now();
        if (now - lastMapUpdate > 100) {
          updateMinimap(playerRig.position.x, playerRig.position.z, playerRig.rotation.y);
          lastMapUpdate = now;
        }

        renderer.render(scene, camera);
      });
    </script>
  </body>
</html>
